database:
  # The name of the user utilized by the application to connect to Tracing DB; The password has to be set either via an ENV var or a file
  user: myuser
  # The host of the Tracing DB instance that accepts the Postgres wire protocol
  host: localhost
  # The port used to connect to the Tracing DB instance via the Postgres wire protocol
  port: 5432
  # The name of the database
  name: tracing
  # Pool settings
  pool:
    # Min num of threads in the pool
    min_size: 3
    # Max num of threads in the pool
    max_size: 3
oidc:
  # Base URL of the keycloak instance, including the protocol ("http" or "https") and the port if needed
  url: <URL_of_OIDC_provider>
  # OIDC realm that contains the client
  realm: <YOUR_REALM>
  # The name of the client in the OIDC system
  client: tracing
  # List of audiences that are accepted by this app
  audiences: [
    "tracing"
  ]
api:
  # The prefix of the root path, e.g. "/tracing-service" results in a callable path like "/tracing-service/api/v2/"
  prefix: ""
  v2:
    # Max num of traces that are returned by the get traces GET call
    default_traces_limit: 20