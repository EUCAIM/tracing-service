[project]
name = "tracing-service"
version = "1.0.1-alpha"
description = "Trace user actions in an immutable way."
requires-python = ">=3.10"

dependencies = [
    "fastapi~=0.141",
    "uvicorn[standard]~=0.52",
    "pydantic~=2.13",
    "pyyaml~=6.0",
    "joserfc~=1.7",
    "httpx~=0.28",
    "annotated-types~=0.8",
    "pydantic-settings~=2.15",
    "psycopg[binary,pool]~=3.3",
    "python-dotenv~=1.2"
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.16",
    "black~=26.5",
]

[tool.uvicorn]
app = "app.main:app"
reload = true
