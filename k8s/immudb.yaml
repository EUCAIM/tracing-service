
apiVersion: v1
kind: Secret
metadata:
  name: immudb-secrets
  namespace: tracing-service
type: Opaque
stringData:
  IMMUDB_ADMIN_PASSWORD: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: immudb-config
  namespace: tracing-service
data:
  IMMUDB_DIR: /data
  IMMUDB_WEB_SERVER: false
  IMMUDB_SWAGGERUI: false
  IMMUDB_METRICS_SERVER: false

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immudb-data
  namespace: tracing-service
spec:
  storageClassName: managed-nfs-storage
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: immudb
  namespace: tracing-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immudb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immudb
    spec:
      priorityClassName: core-services
      nodeSelector:
        chaimeleon.eu/target: core-services
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      securityContext:        
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        runAsNonRoot: true
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown 1000:1000 /data
              chmod u+rwX,g+rwX /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: immudb
          image: codenotary/immudb:1.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: immudb-psql
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: immudb-config
            - secretRef: 
                name: immudb-secrets

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi

          startupProbe:
            tcpSocket:
              port: immudb-psql
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: immudb-psql
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: immudb-psql
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immudb-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

---

apiVersion: v1
kind: Service
metadata:
  name: immudb
  namespace: tracing-service
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: api
  selector:
    app: immudb
